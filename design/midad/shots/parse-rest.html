<!doctype html>
<html lang="en" data-theme="midad">
<head><meta charset="utf-8"><title>Parse card · at rest</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  /* Capture frame: 470x940 at 1x — the size every other screenshot in
     design/midad/screenshots/ already is. Phone 390x844, centred. */
  html,body { margin:0; background:var(--ground); }
  body { width:470px; height:940px; display:grid; place-items:center; }
</style></head>
<body>
    <div class="sq-phone">
      <div class="sq-status"><span>9:41</span><i></i></div>
      <div class="sq-topbar"><div class="sq-quizbar"><button class="sq-iconbtn" aria-label="Quit"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button><div class="sq-progress"><span class="sq-progress__word"><i class="sq-progress__tick" data-at="done"></i></span><span class="sq-progress__word"><i class="sq-progress__tick" data-at="now"></i></span><span class="sq-progress__word"><i class="sq-progress__tick"></i></span><span class="sq-progress__word"><i class="sq-progress__tick"></i></span><span class="sq-progress__word"><i class="sq-progress__tick"></i></span></div><span class="sq-quizbar__count">2 of 5</span></div></div>
      <div class="sq-screen"><div class="sq-prompt"><p class="sq-prompt__word" lang="ar">تَنْصُرُ</p><p class="sq-prompt__gloss">“to help”</p></div><p class="sq-ask">Parse this word<span class="sq-ask__hint">Answer every row.</span></p><div class="sq-axes"><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Form</p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">I</span><span class="sq-chip__ar" lang="ar">مُجَرَّد</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">III</span><span class="sq-chip__ar" lang="ar">فَاعَلَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">VIII</span><span class="sq-chip__ar" lang="ar">اِفْتَعَلَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">X</span><span class="sq-chip__ar" lang="ar">اِسْتَفْعَلَ</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Tense</p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">past</span><span class="sq-chip__ar" lang="ar">مَاضٍ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">present</span><span class="sq-chip__ar" lang="ar">مُضَارِع</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">command</span><span class="sq-chip__ar" lang="ar">أَمْر</span></button></div></div><div class="sq-axis sq-axis--under"><div class="sq-axis__head"><p class="sq-label">Iʿrāb <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">marfūʿ</span><span class="sq-chip__ar" lang="ar">مَرْفُوع</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">manṣūb</span><span class="sq-chip__ar" lang="ar">مَنْصُوب</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">majzūm</span><span class="sq-chip__ar" lang="ar">مَجْزُوم</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">mabnī — no iʿrāb</span><span class="sq-chip__ar" lang="ar">مَبْنِيّ</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Voice <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">maʿrūf</span><span class="sq-chip__ar" lang="ar">مَعْلُوم</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">majhūl</span><span class="sq-chip__ar" lang="ar">مَجْهُول</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Who the doer can be <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">he</span><span class="sq-chip__ar" lang="ar">هُوَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">she</span><span class="sq-chip__ar" lang="ar">هِيَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (m)</span><span class="sq-chip__ar" lang="ar">أَنْتَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (f)</span><span class="sq-chip__ar" lang="ar">أَنْتِ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">we</span><span class="sq-chip__ar" lang="ar">نَحْنُ</span></button></div></div></div></div><div class="sq-dock" style="padding:0 var(--space-4) var(--space-4)"><button class="sq-btn sq-btn--primary sq-btn--block" disabled>Check</button></div>
    </div>
</body></html>
