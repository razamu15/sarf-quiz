<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Sarf Quiz</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .slab { fill: var(--ink); }
  .humra { fill: var(--sign); }
  .tint { fill: var(--fill); }
  .state { fill: var(--correct); }
  .blk { rx: var(--radius-md); }
  .tile { rx: var(--radius-xs); }
  .cut { fill: var(--ground); }
  .mark { fill: var(--sign); }
  .dark { fill: var(--ink); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-size: 84px; line-height: .95; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 3px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 132×236 bled off the top (the brand is ink on paper, so ink takes the slab) · sign 116×172, the one accent · fill 144×132 as the tint for relief · correct 60×22 once, because it only ever means a verdict — ≈30% of 960×288
  arrangement one tall ink slab left in the box, two satellites stepping down to the right, bottoms on the space-6 line
  pattern     root tiles: 16px squares in threes, the three radicals, from "a root is three slots, not a word" — the system's one motif, cut out of the slab and stamped on the ground
  scales      tiles space-4 at a space-6 pitch, gaps space-2, block sides in space-4 multiples, corners radius-md, tiles radius-xs
-->
      <rect class="slab blk" x="24" y="-16" width="132" height="236"/>
      <rect class="state tile" x="24" y="236" width="60" height="22"/>
      <rect class="humra blk" x="176" y="48" width="116" height="172"/>
      <rect class="tint blk" x="312" y="88" width="144" height="132"/>

      <rect class="cut tile" x="40" y="20" width="16" height="16"/>
      <rect class="cut tile" x="64" y="20" width="16" height="16"/>
      <rect class="cut tile" x="88" y="20" width="16" height="16"/>
      <rect class="cut tile" x="40" y="60" width="16" height="16"/>
      <rect class="cut tile" x="64" y="60" width="16" height="16"/>
      <rect class="cut tile" x="88" y="60" width="16" height="16"/>
      <rect class="cut tile" x="40" y="100" width="16" height="16"/>
      <rect class="cut tile" x="64" y="100" width="16" height="16"/>
      <rect class="cut tile" x="88" y="100" width="16" height="16"/>

      <rect class="cut tile" x="196" y="72" width="16" height="16"/>
      <rect class="cut tile" x="220" y="72" width="16" height="16"/>
      <rect class="cut tile" x="244" y="72" width="16" height="16"/>

      <rect class="dark tile" x="336" y="112" width="16" height="16"/>
      <rect class="dark tile" x="360" y="112" width="16" height="16"/>
      <rect class="dark tile" x="384" y="112" width="16" height="16"/>

      <rect class="mark tile" x="176" y="244" width="16" height="16"/>
      <rect class="mark tile" x="200" y="244" width="16" height="16"/>
      <rect class="mark tile" x="224" y="244" width="16" height="16"/>
      <rect class="mark tile" x="312" y="244" width="16" height="16"/>
      <rect class="mark tile" x="336" y="244" width="16" height="16"/>
      <rect class="mark tile" x="360" y="244" width="16" height="16"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Sarf Quiz</h1>
    <p class="tag">Read the signs on Arabic words.</p>
  </div>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
