<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>AnswerOption</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { display: grid; grid-template-columns: repeat(3, 340px); gap: 22px 32px; padding: 20px; align-items: start; }
  .demo figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .demo figcaption { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
  .demo figcaption b { color: var(--ink); }
</style>
</head>
<body>
<div class="demo">
  <figure>
    <figcaption><b>Single answer</b> · no box, so one tap answers. شَرِبَتْ, “What kind of verb is this?”</figcaption>
    <div class="sq-options">
      <button class="sq-option"><span class="sq-option__en">past (māḍī)</span><span class="sq-option__ar" lang="ar">فِعْل مَاضٍ</span></button>
      <button class="sq-option"><span class="sq-option__en">command (amr)</span><span class="sq-option__ar" lang="ar">فِعْل أَمْر</span></button>
      <button class="sq-option"><span class="sq-option__en">present/future (muḍāriʿ)</span><span class="sq-option__ar" lang="ar">فِعْل مُضَارِع</span></button>
    </div>
  </figure>

  <figure>
    <figcaption><b>Checklist</b> · the box is there before any tap. تَنْصُرُ, “Who can the doer be?” with هِيَ picked</figcaption>
    <div class="sq-options">
      <button class="sq-option"><span class="sq-option__box"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">you (f)</span><span class="sq-option__ar" lang="ar">أَنْتِ</span></button>
      <button class="sq-option"><span class="sq-option__box"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">he</span><span class="sq-option__ar" lang="ar">هُوَ</span></button>
      <button class="sq-option" data-state="picked" aria-pressed="true"><span class="sq-option__box"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">she</span><span class="sq-option__ar" lang="ar">هِيَ</span></button>
      <button class="sq-option"><span class="sq-option__box"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">you (m)</span><span class="sq-option__ar" lang="ar">أَنْتَ</span></button>
    </div>
  </figure>

  <figure>
    <figcaption><b>Arabic only</b> · the English would give it away. “they two (m) did not teach”</figcaption>
    <div class="sq-options">
      <button class="sq-option sq-option--ar-only"><span class="sq-option__ar" lang="ar">لَنْ تَعْلَمْنَ</span></button>
      <button class="sq-option sq-option--ar-only"><span class="sq-option__ar" lang="ar">لَمْ يُعَلِّمَا</span></button>
      <button class="sq-option sq-option--ar-only"><span class="sq-option__ar" lang="ar">لَمْ أَسْتَعْلِمْ</span></button>
      <button class="sq-option sq-option--ar-only"><span class="sq-option__ar" lang="ar">لَمْ يَتَعَلَّمْنَ</span></button>
    </div>
  </figure>

  <figure>
    <figcaption><b>Graded, wrong pick</b> · the cross and the strike carry it, not colour alone; the answer is dashed</figcaption>
    <div class="sq-options">
      <button class="sq-option" data-state="missed" disabled><svg class="sq-icon sq-option__mark" viewBox="0 0 24 24"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></svg><span class="sq-option__en">past (māḍī)</span><span class="sq-option__ar" lang="ar">فِعْل مَاضٍ</span></button>
      <button class="sq-option" data-state="wrong" disabled><span class="sq-option__mark"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span><span class="sq-option__en">command (amr)</span><span class="sq-option__ar" lang="ar">فِعْل أَمْر</span></button>
      <button class="sq-option" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__en">present/future (muḍāriʿ)</span><span class="sq-option__ar" lang="ar">فِعْل مُضَارِع</span></button>
    </div>
  </figure>

  <figure>
    <figcaption><b>Graded, half right</b> · هِيَ was right; أَنْتَ was also right and missed</figcaption>
    <div class="sq-options">
      <button class="sq-option" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__en">you (f)</span><span class="sq-option__ar" lang="ar">أَنْتِ</span></button>
      <button class="sq-option" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__en">he</span><span class="sq-option__ar" lang="ar">هُوَ</span></button>
      <button class="sq-option" data-state="correct" disabled><span class="sq-option__mark"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">she</span><span class="sq-option__ar" lang="ar">هِيَ</span></button>
      <button class="sq-option" data-state="missed" disabled><span class="sq-option__mark"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__en">you (m) <span class="sq-option__verdict">· missed</span></span><span class="sq-option__ar" lang="ar">أَنْتَ</span></button>
    </div>
  </figure>

  <figure>
    <figcaption><b>Graded, right</b> · after the answer the particles are revealed in the sign colour</figcaption>
    <div class="sq-options">
      <button class="sq-option sq-option--ar-only" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__ar" lang="ar"><span class="sq-sign">لَنْ</span> تَعْلَمْنَ</span></button>
      <button class="sq-option sq-option--ar-only" data-state="correct" disabled><span class="sq-option__mark"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sq-option__ar" lang="ar"><span class="sq-sign">لَمْ</span> يُعَلِّمَا</span></button>
      <button class="sq-option sq-option--ar-only" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__ar" lang="ar"><span class="sq-sign">لَمْ</span> أَسْتَعْلِمْ</span></button>
      <button class="sq-option sq-option--ar-only" data-state="rest" disabled><span class="sq-option__mark"></span><span class="sq-option__ar" lang="ar"><span class="sq-sign">لَمْ</span> يَتَعَلَّمْنَ</span></button>
    </div>
  </figure>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
