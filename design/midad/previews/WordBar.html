<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>WordBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { display: flex; flex-direction: column; gap: 18px; padding: 18px 16px; max-width: 420px; }
  .demo figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .demo figcaption { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="demo">
  <figure>
    <figcaption>Chosen · the verb has taken the field over, with its meaning beside it</figcaption>
    <div class="sq-wordbar" data-mode="word">
      <span class="sq-wordbar__word"><bdi class="sq-ar" lang="ar">نَصَرَ يَنْصُرُ</bdi><span class="sq-gloss">“to help”</span></span>
      <span class="sq-wordbar__clear"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span>
    </div>
  </figure>

  <figure>
    <figcaption>Searching · reached only through the X, so the screen is never showing one verb and searching for another</figcaption>
    <div class="sq-wordbar">
      <svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span class="sq-wordbar__placeholder">Root letters or meaning</span>
      <span class="sq-wordbar__clear"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span>
    </div>
    <ul class="sq-list"><li><button class="sq-listrow"><span class="sq-listrow__text"><span class="sq-listrow__title"><bdi class="sq-ar" lang="ar">نَصَرَ يَنْصُرُ</bdi></span><span class="sq-listrow__sub">“to help” · 5 forms · Sound</span></span><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></li><li><button class="sq-listrow"><span class="sq-listrow__text"><span class="sq-listrow__title"><bdi class="sq-ar" lang="ar">خَرَجَ يَخْرُجُ</bdi></span><span class="sq-listrow__sub">“to go out” · 5 forms · Sound</span></span><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></li><li><button class="sq-listrow"><span class="sq-listrow__text"><span class="sq-listrow__title"><bdi class="sq-ar" lang="ar">قَالَ يَقُولُ</bdi></span><span class="sq-listrow__sub">“to say” · 7 forms · Hollow</span></span><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></li><li><button class="sq-listrow"><span class="sq-listrow__text"><span class="sq-listrow__title"><bdi class="sq-ar" lang="ar">كَتَبَ يَكْتُبُ</bdi></span><span class="sq-listrow__sub">“to write” · 7 forms · Sound</span></span><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button></li></ul>
  </figure>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
