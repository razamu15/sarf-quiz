<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ParseAxes</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { display: grid; grid-template-columns: repeat(3, 340px); gap: 28px 32px; padding: 20px; align-items: start; }
  .demo figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .demo figcaption { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
  .demo figcaption code { font: 600 12px/16px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); }
</style>
</head>
<body>
<div class="demo">
  <figure>
    <figcaption><code>select: one</code> · a row at rest. No tick box: this row replaces.</figcaption>
    <div class="sq-axes"><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Tense</p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">past</span><span class="sq-chip__ar" lang="ar">مَاضٍ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">present</span><span class="sq-chip__ar" lang="ar">مُضَارِع</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">command</span><span class="sq-chip__ar" lang="ar">أَمْر</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption><code>select: many</code> · a row that can collapse. <b>The tick box is there before any tap</b> — a property of the axis, never of the draw (D-60, D-74).</figcaption>
    <div class="sq-axes"><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Voice <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">maʿrūf</span><span class="sq-chip__ar" lang="ar">مَعْلُوم</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">majhūl</span><span class="sq-chip__ar" lang="ar">مَجْهُول</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption>picked, before <b>Check</b></figcaption>
    <div class="sq-axes"><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Who the doer can be <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">he</span><span class="sq-chip__ar" lang="ar">هُوَ</span></button><button class="sq-chip" aria-pressed="true"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">she</span><span class="sq-chip__ar" lang="ar">هِيَ</span></button><button class="sq-chip" aria-pressed="true"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (m)</span><span class="sq-chip__ar" lang="ar">أَنْتَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (f)</span><span class="sq-chip__ar" lang="ar">أَنْتِ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">we</span><span class="sq-chip__ar" lang="ar">نَحْنُ</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption>graded, <b>right</b> — the row collapses to its answer. The distractors have done their work.</figcaption>
    <div class="sq-axes"><div class="sq-axis" data-verdict="correct"><div class="sq-axis__head"><p class="sq-label">Tense</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="rest"><span class="sq-chip__en">past</span><span class="sq-chip__ar" lang="ar">مَاضٍ</span></button><button class="sq-chip" data-state="correct"><span class="sq-chip__en">present</span><span class="sq-chip__ar" lang="ar">مُضَارِع</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">command</span><span class="sq-chip__ar" lang="ar">أَمْر</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption>graded, <b>missed one</b> — the row stays open, every chip in its state. <code>تَنْصُرُ</code> is <span class="sq-ar" lang="ar">هِيَ</span> <i>and</i> <span class="sq-ar" lang="ar">أَنْتَ</span> (D-74).</figcaption>
    <div class="sq-axes"><div class="sq-axis" data-verdict="wrong"><div class="sq-axis__head"><p class="sq-label">Who the doer can be</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="rest"><span class="sq-chip__en">he</span><span class="sq-chip__ar" lang="ar">هُوَ</span></button><button class="sq-chip" data-state="correct"><span class="sq-chip__en">she</span><span class="sq-chip__ar" lang="ar">هِيَ</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="missed"><span class="sq-chip__en">you (m)</span><span class="sq-chip__ar" lang="ar">أَنْتَ</span><span class="sq-chip__verdict">· missed</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">you (f)</span><span class="sq-chip__ar" lang="ar">أَنْتِ</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">we</span><span class="sq-chip__ar" lang="ar">نَحْنُ</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption><b>the whole card at rest</b> — Form · Tense · Iʿrāb · Voice · Doer, the order and the indent Practice uses</figcaption>
    <div class="sq-axes"><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Form</p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">I</span><span class="sq-chip__ar" lang="ar">مُجَرَّد</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">III</span><span class="sq-chip__ar" lang="ar">فَاعَلَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">VIII</span><span class="sq-chip__ar" lang="ar">اِفْتَعَلَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__num">X</span><span class="sq-chip__ar" lang="ar">اِسْتَفْعَلَ</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Tense</p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">past</span><span class="sq-chip__ar" lang="ar">مَاضٍ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">present</span><span class="sq-chip__ar" lang="ar">مُضَارِع</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__en">command</span><span class="sq-chip__ar" lang="ar">أَمْر</span></button></div></div><div class="sq-axis sq-axis--under"><div class="sq-axis__head"><p class="sq-label">Iʿrāb <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">marfūʿ</span><span class="sq-chip__ar" lang="ar">مَرْفُوع</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">manṣūb</span><span class="sq-chip__ar" lang="ar">مَنْصُوب</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">majzūm</span><span class="sq-chip__ar" lang="ar">مَجْزُوم</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">mabnī — no iʿrāb</span><span class="sq-chip__ar" lang="ar">مَبْنِيّ</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Voice <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">maʿrūf</span><span class="sq-chip__ar" lang="ar">مَعْلُوم</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">majhūl</span><span class="sq-chip__ar" lang="ar">مَجْهُول</span></button></div></div><div class="sq-axis"><div class="sq-axis__head"><p class="sq-label">Who the doer can be <small>select all that apply</small></p></div><div class="sq-chips"><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">he</span><span class="sq-chip__ar" lang="ar">هُوَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">she</span><span class="sq-chip__ar" lang="ar">هِيَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (m)</span><span class="sq-chip__ar" lang="ar">أَنْتَ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">you (f)</span><span class="sq-chip__ar" lang="ar">أَنْتِ</span></button><button class="sq-chip" aria-pressed="false"><span class="sq-chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12.5l5 5 9-11"/></svg></span><span class="sq-chip__en">we</span><span class="sq-chip__ar" lang="ar">نَحْنُ</span></button></div></div></div>
  </figure>
  <figure>
    <figcaption><b>the whole card graded</b> — four rows collapsed, the missed row open. Without the collapse the answer sheet covers the row it is explaining.</figcaption>
    <div class="sq-axes"><div class="sq-axis" data-verdict="correct"><div class="sq-axis__head"><p class="sq-label">Form</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="correct"><span class="sq-chip__num">I</span><span class="sq-chip__ar" lang="ar">مُجَرَّد</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__num">III</span><span class="sq-chip__ar" lang="ar">فَاعَلَ</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__num">VIII</span><span class="sq-chip__ar" lang="ar">اِفْتَعَلَ</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__num">X</span><span class="sq-chip__ar" lang="ar">اِسْتَفْعَلَ</span></button></div></div><div class="sq-axis" data-verdict="correct"><div class="sq-axis__head"><p class="sq-label">Tense</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="rest"><span class="sq-chip__en">past</span><span class="sq-chip__ar" lang="ar">مَاضٍ</span></button><button class="sq-chip" data-state="correct"><span class="sq-chip__en">present</span><span class="sq-chip__ar" lang="ar">مُضَارِع</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">command</span><span class="sq-chip__ar" lang="ar">أَمْر</span></button></div></div><div class="sq-axis sq-axis--under" data-verdict="correct"><div class="sq-axis__head"><p class="sq-label">Iʿrāb</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="correct"><span class="sq-chip__en">marfūʿ</span><span class="sq-chip__ar" lang="ar">مَرْفُوع</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">manṣūb</span><span class="sq-chip__ar" lang="ar">مَنْصُوب</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">majzūm</span><span class="sq-chip__ar" lang="ar">مَجْزُوم</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">mabnī</span><span class="sq-chip__ar" lang="ar">مَبْنِيّ</span></button></div></div><div class="sq-axis" data-verdict="correct"><div class="sq-axis__head"><p class="sq-label">Voice</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="correct"><span class="sq-chip__en">maʿrūf</span><span class="sq-chip__ar" lang="ar">مَعْلُوم</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">majhūl</span><span class="sq-chip__ar" lang="ar">مَجْهُول</span></button></div></div><div class="sq-axis" data-verdict="wrong"><div class="sq-axis__head"><p class="sq-label">Who the doer can be</p><span class="sq-axis__mark"><svg class="sq-icon" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></div><div class="sq-chips"><button class="sq-chip" data-state="rest"><span class="sq-chip__en">he</span><span class="sq-chip__ar" lang="ar">هُوَ</span></button><button class="sq-chip" data-state="correct"><span class="sq-chip__en">she</span><span class="sq-chip__ar" lang="ar">هِيَ</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="missed"><span class="sq-chip__en">you (m)</span><span class="sq-chip__ar" lang="ar">أَنْتَ</span><span class="sq-chip__verdict">· missed</span><svg class="sq-chip__mark sq-icon" viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">you (f)</span><span class="sq-chip__ar" lang="ar">أَنْتِ</span></button><button class="sq-chip" data-state="rest"><span class="sq-chip__en">we</span><span class="sq-chip__ar" lang="ar">نَحْنُ</span></button></div></div></div>
  </figure>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
