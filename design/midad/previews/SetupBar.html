<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SetupBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { display: flex; flex-direction: column; gap: 18px; padding: 18px 16px; max-width: 420px; }
  .demo figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .demo figcaption { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
  .demo .sq-setupbar { border: 1px solid var(--line); border-radius: var(--radius-md); }
</style>
</head>
<body>
<div class="demo">
  <figure>
    <figcaption>Sound verbs · I, II, X · māḍī and muḍāriʿ, maʿrūf, marfūʿ</figcaption>
    <div class="sq-setupbar">
      <div class="sq-asks">
        <div class="sq-asks__head">
          <p class="sq-asks__label">This setup asks</p>
          <p class="sq-setupbar__count">≈ 4,200 <small>questions</small></p>
        </div>
        <div class="sq-kinds">
          <span class="sq-kind"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tense</span>
          <span class="sq-kind"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Who the doer is</span>
          <span class="sq-kind"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Bāb</span>
        </div>
        <p class="sq-asks__why"><b>Voice</b> — only one voice reachable</p>
        <p class="sq-asks__why"><b>Iʿrāb</b> — iʿrāb needs the muḍāriʿ in more than one state</p>
      </div>
      <div class="sq-setupbar__go">
        <p class="sq-label">How many</p>
        <div class="sq-seg sq-seg--sm">
          <button aria-pressed="false">5</button><button aria-pressed="true">10</button>
          <button aria-pressed="false">20</button><button aria-pressed="false" aria-label="Endless">∞</button>
        </div>
      </div>
      <button class="sq-btn sq-btn--primary sq-btn--block">Start</button>
    </div>
  </figure>

  <figure>
    <figcaption>The same setup with the māḍī dropped · one kind left, and four reasons that each name an axis to widen</figcaption>
    <div class="sq-setupbar">
      <div class="sq-asks">
        <div class="sq-asks__head">
          <p class="sq-asks__label">This setup asks</p>
          <p class="sq-setupbar__count">≈ 700 <small>questions</small></p>
        </div>
        <div class="sq-kinds">
          <span class="sq-kind"><svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Who the doer is</span>
        </div>
        <p class="sq-asks__why"><b>Tense</b> — only one tense selected</p>
        <p class="sq-asks__why"><b>Voice</b> — only one voice reachable</p>
        <p class="sq-asks__why"><b>Iʿrāb</b> — iʿrāb needs the muḍāriʿ in more than one state</p>
        <p class="sq-asks__why"><b>Bāb</b> — needs both tenses in scope, and more than one bāb</p>
      </div>
      <div class="sq-setupbar__go">
        <p class="sq-label">How many</p>
        <div class="sq-seg sq-seg--sm">
          <button aria-pressed="false">5</button><button aria-pressed="true">10</button>
          <button aria-pressed="false">20</button><button aria-pressed="false" aria-label="Endless">∞</button>
        </div>
      </div>
      <button class="sq-btn sq-btn--primary sq-btn--block">Start</button>
    </div>
  </figure>

  <figure>
    <figcaption>Nothing left to ask · the reasons are the instructions for fixing it</figcaption>
    <div class="sq-setupbar">
      <div class="sq-asks">
        <div class="sq-asks__head">
          <p class="sq-asks__label">This setup asks</p>
          <p class="sq-setupbar__count">Nothing <small>in scope</small></p>
        </div>
        <p class="sq-asks__none">Nothing — widen the selection</p>
        <p class="sq-asks__why"><b>Tense</b> — only one tense selected</p>
        <p class="sq-asks__why"><b>Who the doer is</b> — only one pronoun reachable</p>
      </div>
      <div class="sq-setupbar__go">
        <p class="sq-label">How many</p>
        <div class="sq-seg sq-seg--sm">
          <button aria-pressed="false">5</button><button aria-pressed="true">10</button>
          <button aria-pressed="false">20</button><button aria-pressed="false" aria-label="Endless">∞</button>
        </div>
      </div>
      <button class="sq-btn sq-btn--primary sq-btn--block" disabled>Start</button>
    </div>
  </figure>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
