<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>StatStrip</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { display: flex; flex-direction: column; gap: 16px; padding: 18px 16px; max-width: 420px; }
  .demo figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .demo figcaption { font: 600 12px/16px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="demo">
  <figure>
    <figcaption>Sample history — the row underneath is accuracy on one question kind</figcaption>
    <div class="sq-stats">
      <span class="sq-stat"><b>5</b><span>day streak</span></span>
      <span class="sq-stat"><b>86</b><span>this week</span></span>
      <span class="sq-stat"><b>71%</b><span>accuracy</span></span>
      <button class="sq-weak">
        <span class="sq-weak__text">
          <span class="sq-weak__label">Weakest question</span>
          <span class="sq-weak__title">Iʿrāb <small>58% of 40 answers</small></span>
          <span class="sq-weak__meter"><i style="width:58%"></i></span>
        </span>
        <span class="sq-weak__cta">Drill it<svg class="sq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></span>
      </button>
    </div>
  </figure>

  <figure>
    <figcaption>Before the first drill — an honest gap, not a zero</figcaption>
    <div class="sq-stats">
      <span class="sq-stat" style="grid-column: 1 / -1"><b>No drills yet</b><span>Your streak, your accuracy and what to work on show up here.</span></span>
    </div>
  </figure>
</div>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
