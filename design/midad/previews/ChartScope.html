<!doctype html>
<html lang="en" data-theme="midad">
<head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ChartScope</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
  .demo { padding: 18px 16px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  .demo > .sq-hint { margin-top: -4px; }
</style>
</head>
<body>
<div class="demo">
  <div id="scope"></div>
  <p class="sq-hint">Tap a chip. The iʿrāb group belongs to the muḍāriʿ: drop that tense and the group
  greys out in place, its label saying so. A plan is tense × voice × iʿrāb, so a single chart cannot be
  picked on its own — the count is the read-out that says how many whole charts the three add up to.</p>
</div>
<script>

const ICONS = {"check":"<path d=\"M5 12.5l4.5 4.5L19 7.5\"/>","x":"<path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"/>","chevron":"<path d=\"M9.5 5.5L16 12l-6.5 6.5\"/>","bulb":"<path d=\"M9.5 18h5M10.5 21h3M12 3.5a5.5 5.5 0 0 0-3.2 10c.6.5.9 1.1.9 1.9v.1h4.6v-.1c0-.8.3-1.4.9-1.9A5.5 5.5 0 0 0 12 3.5z\"/>","house":"<path d=\"M4 11.2L12 4.5l8 6.7M6.5 9.5V19.5h4v-5h3v5h4V9.5\"/>","sliders":"<path d=\"M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9\"/><circle cx=\"15\" cy=\"7.5\" r=\"2\"/><circle cx=\"9\" cy=\"16.5\" r=\"2\"/>","table":"<rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"15\" rx=\"2.5\"/><path d=\"M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10M14.5 9.5v10\"/>","more":"<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M8.2 12h.01M12 12h.01M15.8 12h.01\" stroke-width=\"2.6\"/>","search":"<circle cx=\"10.5\" cy=\"10.5\" r=\"6\"/><path d=\"M15 15l5 5\"/>","back":"<path d=\"M14.5 5.5L8 12l6.5 6.5\"/>","list":"<path d=\"M8.5 7h11M8.5 12h11M8.5 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01\"/>","grid":"<rect x=\"4\" y=\"4\" width=\"6.5\" height=\"6.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"4\" width=\"6.5\" height=\"6.5\" rx=\"1.5\"/><rect x=\"4\" y=\"13.5\" width=\"6.5\" height=\"6.5\" rx=\"1.5\"/><rect x=\"13.5\" y=\"13.5\" width=\"6.5\" height=\"6.5\" rx=\"1.5\"/>"};
const icon = (n, cls = '') => `<svg class="sq-icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Bidi: every Arabic run in a mixed sentence becomes its own isolate, so
// "شَرِبَتْ — فِعْل مَاضٍ from شَرِبَ يَشْرَبُ." keeps its logical order.
const AR_RUN = /[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff\ufb50-\ufdff\ufe70-\ufeff]+(?:\s+[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff\ufb50-\ufdff\ufe70-\ufeff]+)*/g;
const isolate = (s) => esc(s).replace(AR_RUN, (m) => `<bdi class="sq-ar" lang="ar">${m}</bdi>`);
const ar = (s, cls = '') => `<bdi class="sq-ar ${cls}" lang="ar">${esc(s)}</bdi>`;
// Grapheme clusters: a letter WITH its marks, the unit grading and highlighting use.
const clusters = (s) => [...new Intl.Segmenter('ar', { granularity: 'grapheme' }).segment(s)].map((x) => x.segment);
const TENSE_EN = { madi: 'māḍī', mudari: 'muḍāriʿ', amr: 'amr' };
const VOICE_EN = { malum: 'maʿrūf', majhul: 'majhūl' };
const MOOD_EN = { raf: 'marfūʿ', nasb: 'manṣūb', jazm: 'majzūm' };
const chartLabel = (formId, t, v, m) => ['Form ' + formId, TENSE_EN[t], t === 'amr' ? null : VOICE_EN[v], m ? MOOD_EN[m] : null].filter(Boolean).join(' · ');
// The paradigm grid: singular, dual, plural across (right to left); he, she, you (m), you (f), I down.
const GRID_ROWS = [['3ms', '3md', '3mp'], ['3fs', '3fd', '3fp'], ['2ms', '2md', '2mp'], ['2fs', '2fd', '2fp'], ['1s', '1p']];
const AMR_ROWS = [['2ms', '2md', '2mp'], ['2fs', '2fd', '2fp']];
function gridHtml(table, tense, pronouns, hits = []) {
  const rows = tense === 'amr' ? AMR_ROWS : GRID_ROWS;
  const heads = [['مُفْرَد', 'one'], ['مُثَنًّى', 'two'], ['جَمْع', 'three +']]
    .map(([a, e]) => `<div class="sq-grid__head">${ar(a)}<small>${e}</small></div>`).join('');
  const cells = rows.map((row, r) => row.map((slot) => {
    const attrs = [slot === '1p' ? 'data-span="2"' : '', hits.includes(slot) ? 'data-hit' : '',
      tense !== 'amr' && (r === 2 || r === 4) ? 'data-band' : ''].filter(Boolean).join(' ');
    return `<div class="sq-cell" ${attrs}><span class="sq-cell__pron">${esc(pronouns[slot].ar)}</span>`
      + `<span class="sq-cell__word">${table[slot] ? esc(table[slot]) : '—'}</span></div>`;
  }).join('')).join('');
  return `<div class="sq-grid${tense === 'amr' ? ' sq-grid--amr' : ''}">${heads}${cells}</div>`;
}

const state = { tenses: new Set(['madi', 'mudari']), voices: new Set(['malum']), moods: new Set(['raf']) };
const MOODS = ['raf', 'nasb', 'jazm'];
const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));

// planCharts(): the amr contributes one chart whatever the voice row says.
const covered = () => {
  const out = [];
  if (state.tenses.has('madi')) state.voices.forEach((v) => out.push(`madi|${v}`));
  if (state.tenses.has('mudari')) state.voices.forEach((v) => state.moods.forEach((m) => out.push(`mudari|${v}|${m}`)));
  if (state.tenses.has('amr')) out.push('amr');
  return out;
};

function render() {
  const on = covered();
  const mudari = state.tenses.has('mudari');
  const amrOnly = state.tenses.size === 1 && state.tenses.has('amr');
  const chip = (label, arabic, pressed, k, off) =>
    `<button class="sq-chip" data-axis="${k}" aria-pressed="${pressed}" ${off ? 'disabled' : ''}>`
    + `<span>${label}</span>${arabic ? `<span class="sq-chip__ar" lang="ar">${arabic}</span>` : ''}</button>`;

  document.getElementById('scope').innerHTML = `<div class="sq-scope">
    <div class="sq-scope__group"><p class="sq-label">Tense</p>
      <div class="sq-chips">
        ${chip('māḍī', 'مَاضٍ', state.tenses.has('madi'), 'madi')}
        ${chip('muḍāriʿ', 'مُضَارِع', mudari, 'mudari')}
        ${chip('amr', 'أَمْر', state.tenses.has('amr'), 'amr')}
      </div></div>

    <div class="sq-scope__group sq-scope__group--under">
      <p class="sq-label">Iʿrāb <small>${mudari ? 'of the muḍāriʿ' : 'needs the muḍāriʿ'}</small></p>
      <div class="sq-chips">
        ${MOODS.map((m) => chip(MOOD_EN[m], '', state.moods.has(m), m, !mudari)).join('')}
      </div></div>

    <div class="sq-scope__group"><p class="sq-label">Voice</p>
      <div class="sq-chips">
        ${chip('maʿrūf', '', state.voices.has('malum'), 'malum', amrOnly)}
        ${chip('majhūl', '', state.voices.has('majhul'), 'majhul', amrOnly)}
      </div>
      ${amrOnly ? '<p class="sq-hint">The amr has neither voice nor iʿrāb — it is one chart on its own.</p>' : ''}</div>

    <p class="sq-scope__count">${on.length} of 9 <small>charts in scope</small></p>
  </div>`;

  document.querySelectorAll('[data-axis]').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.axis;
      toggle(['madi', 'mudari', 'amr'].includes(k) ? state.tenses : MOODS.includes(k) ? state.moods : state.voices, k);
      render();
    };
  });
}
render();
</script>

<div style="position:fixed;top:10px;right:10px;z-index:99">
  <button id="sq-theme-toggle" style="font:600 12px/1 -apple-system,system-ui;padding:7px 11px;border-radius:8px;
    border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer">Paper / Night</button>
</div>
<script>
  document.getElementById('sq-theme-toggle').onclick = () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'midad' ? 'midad-night' : 'midad';
  };
</script>
</body>
</html>
