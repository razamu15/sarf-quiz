# Xcode project definition — regenerate the .xcodeproj with:
#   cd ios/SarfQuiz && xcodegen generate
# The generated project is gitignored; this file is the source of truth.
name: SarfQuiz
options:
  bundleIdPrefix: dev.saad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SarfCore:
    path: ../SarfCore
schemes:
  SarfQuiz:
    build:
      targets:
        SarfQuiz: all
    test:
      targets:
        - SarfQuizUITests
targets:
  SarfQuiz:
    type: application
    platform: iOS
    sources:
      - SarfQuiz
    dependencies:
      - package: SarfCore
        product: SarfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.saad.sarfquiz
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
  SarfQuizUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SarfQuizUITests
    dependencies:
      - target: SarfQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
